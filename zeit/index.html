    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 3rem;
            color: #10b981;
        }

        .task-display {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .task-text {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #10b981;
        }

        .status {
            font-size: 1.2rem;
            margin-top: 1rem;
            min-height: 1.5rem;
        }

        .mic-container {
            position: relative;
            margin: 2rem 0;
        }

        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .mic-button.listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            }
            50% {
                box-shadow: 0 4px 40px rgba(239, 68, 68, 0.8);
            }
        }

        .result {
            font-size: 1.5rem;
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 10px;
        }

        .result.correct {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .result.incorrect {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .new-task-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .new-task-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        .score {
            margin-top: 2rem;
            font-size: 1.2rem;
            color: #a0aec0;
        }

        .recognized-text {
            font-size: 1rem;
            color: #cbd5e0;
            margin-top: 0.5rem;
            min-height: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕐 Uhrzeiten-Trainer</h1>
        
        <div class="task-display">
            <div class="task-text" id="taskText">Bereit?</div>
            <div class="status" id="status"></div>
            <div class="recognized-text" id="recognizedText"></div>
        </div>

        <div class="mic-container">
            <button class="mic-button" id="micButton">🎤</button>
        </div>

        <div id="resultArea"></div>
        
        <div class="score">
            <div>Richtig: <span id="correctCount">0</span> | Falsch: <span id="incorrectCount">0</span></div>
        </div>
    </div>

    <script>
        const vocabList = [
            { de: 'viertel nach eins', en: 'quarter past one' },
            { de: 'viertel nach zwei', en: 'quarter past two' },
            { de: 'viertel nach drei', en: 'quarter past three' },
            { de: 'viertel nach vier', en: 'quarter past four' },
            { de: 'viertel nach fünf', en: 'quarter past five' },
            { de: 'viertel nach sechs', en: 'quarter past six' },
            { de: 'viertel nach sieben', en: 'quarter past seven' },
            { de: 'viertel nach acht', en: 'quarter past eight' },
            { de: 'viertel nach neun', en: 'quarter past nine' },
            { de: 'viertel nach zehn', en: 'quarter past ten' },
            { de: 'viertel nach elf', en: 'quarter past eleven' },
            { de: 'viertel nach zwölf', en: 'quarter past twelve' },
            
            { de: 'halb eins', en: 'half past twelve' },
            { de: 'halb zwei', en: 'half past one' },
            { de: 'halb drei', en: 'half past two' },
            { de: 'halb vier', en: 'half past three' },
            { de: 'halb fünf', en: 'half past four' },
            { de: 'halb sechs', en: 'half past five' },
            { de: 'halb sieben', en: 'half past six' },
            { de: 'halb acht', en: 'half past seven' },
            { de: 'halb neun', en: 'half past eight' },
            { de: 'halb zehn', en: 'half past nine' },
            { de: 'halb elf', en: 'half past ten' },
            { de: 'halb zwölf', en: 'half past eleven' },
            
            { de: 'viertel vor eins', en: 'quarter to one' },
            { de: 'viertel vor zwei', en: 'quarter to two' },
            { de: 'viertel vor drei', en: 'quarter to three' },
            { de: 'viertel vor vier', en: 'quarter to four' },
            { de: 'viertel vor fünf', en: 'quarter to five' },
            { de: 'viertel vor sechs', en: 'quarter to six' },
            { de: 'viertel vor sieben', en: 'quarter to seven' },
            { de: 'viertel vor acht', en: 'quarter to eight' },
            { de: 'viertel vor neun', en: 'quarter to nine' },
            { de: 'viertel vor zehn', en: 'quarter to ten' },
            { de: 'viertel vor elf', en: 'quarter to eleven' },
            { de: 'viertel vor zwölf', en: 'quarter to twelve' },
            
            { de: 'um eins', en: 'at one' },
            { de: 'um zwei', en: 'at two' },
            { de: 'um drei', en: 'at three' },
            { de: 'um vier', en: 'at four' },
            { de: 'um fünf', en: 'at five' },
            { de: 'um sechs', en: 'at six' },
            { de: 'um sieben', en: 'at seven' },
            { de: 'um acht', en: 'at eight' },
            { de: 'um neun', en: 'at nine' },
            { de: 'um zehn', en: 'at ten' },
            { de: 'um elf', en: 'at eleven' },
            { de: 'um zwölf', en: 'at twelve' }
        ];

        let currentTask = null;
        let correctCount = 0;
        let incorrectCount = 0;
        let recognition = null;
        let isListening = false;

        const taskText = document.getElementById('taskText');
        const status = document.getElementById('status');
        const recognizedText = document.getElementById('recognizedText');
        const micButton = document.getElementById('micButton');
        const resultArea = document.getElementById('resultArea');
        const correctCountEl = document.getElementById('correctCount');
        const incorrectCountEl = document.getElementById('incorrectCount');

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                const transcript = Array.from(event.results)
                    .map(result => result[0].transcript)
                    .join('');
                recognizedText.textContent = `"${transcript}"`;
                
                if (event.results[0].isFinal) {
                    checkAnswer(transcript.toLowerCase().trim());
                }
            };

            recognition.onend = () => {
                isListening = false;
                micButton.classList.remove('listening');
                if (currentTask && !resultArea.innerHTML) {
                    startListening();
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                isListening = false;
                micButton.classList.remove('listening');
                if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    status.textContent = 'Fehler bei der Spracherkennung';
                }
            };
        }

        function speak(text, lang = 'de-DE') {
            return new Promise((resolve) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                utterance.onend = resolve;
                speechSynthesis.speak(utterance);
            });
        }

        function startListening() {
            if (!recognition || isListening) return;
            
            try {
                isListening = true;
                micButton.classList.add('listening');
                recognition.start();
                status.textContent = '🎤 Sprich jetzt auf Englisch...';
            } catch (error) {
                console.error('Error starting recognition:', error);
                isListening = false;
                micButton.classList.remove('listening');
            }
        }

        function stopListening() {
            if (recognition && isListening) {
                isListening = false;
                recognition.stop();
                micButton.classList.remove('listening');
            }
        }

        function normalizeAnswer(text) {
            return text.toLowerCase()
                .replace(/\s+/g, ' ')
                .replace(/o'clock/g, '')
                .replace(/[.,!?]/g, '')
                .trim();
        }

        function checkAnswer(userAnswer) {
            stopListening();
            
            const normalizedUser = normalizeAnswer(userAnswer);
            const normalizedCorrect = normalizeAnswer(currentTask.en);
            
            const isCorrect = normalizedUser === normalizedCorrect;
            
            resultArea.innerHTML = `
                <div class="result ${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? '✓ Richtig!' : '✗ Falsch'}
                </div>
                <button class="new-task-btn" onclick="newTask()">Neue Aufgabe</button>
            `;
            
            if (isCorrect) {
                correctCount++;
                correctCountEl.textContent = correctCount;
            } else {
                incorrectCount++;
                incorrectCountEl.textContent = incorrectCount;
            }
            
            status.textContent = '';
            
            setTimeout(async () => {
                await speak(`${currentTask.de} heißt auf Englisch ${currentTask.en}`, 'de-DE');
                setTimeout(() => {
                    if (resultArea.innerHTML) {
                        newTask();
                    }
                }, 1000);
            }, 100);
        }

        async function newTask() {
            stopListening();
            
            if (currentTask) {
                await speak(`${currentTask.de} heißt auf Englisch ${currentTask.en}`, 'de-DE');
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            currentTask = vocabList[Math.floor(Math.random() * vocabList.length)];
            taskText.textContent = currentTask.de;
            status.textContent = '';
            recognizedText.textContent = '';
            resultArea.innerHTML = '';
            
            await speak(currentTask.de, 'de-DE');
            
            setTimeout(() => {
                startListening();
            }, 500);
        }

        micButton.addEventListener('click', () => {
            if (!currentTask) {
                newTask();
            } else if (!isListening) {
                startListening();
            }
        });

        // Start first task
        setTimeout(() => {
            newTask();
        }, 500);
    </script>
</body>
</html>
